[package]
name = "libmdnsresponder"
description = "Library for communicating with mDNSResponder over its Unix socket"
homepage = "https://github.com/mikaelsahlstrom/rust-libmdnsresponder"
repository = "https://github.com/mikaelsahlstrom/rust-libmdnsresponder"
readme = "README.md"
keywords = ["mdns", "dns-sd", "mdnsresponder"]

version = "1.0.0"
edition = "2024"
license-file = "LICENSE"

[lib]
name = "mdnsresponder"
path = "src/lib.rs"
crate-type = ["lib"]

[dependencies]
log = "0.4.29"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7.18"
rand = "0.10.0"

[dev-dependencies]
env_logger = "0.11.9"
